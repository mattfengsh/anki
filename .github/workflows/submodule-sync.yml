name: Submodule Auto-Sync

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 定时执行
  workflow_dispatch:     # 支持在 GitHub 网页手动点击触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: false # 关闭默认克隆，避免浅克隆导致缺少 ref
          fetch-depth: 0

      - name: Sync and update submodules
        shell: bash
        run: |
          set -e

          # 1. 注册并同步子模块配置
          git submodule init
          git submodule sync --recursive

          # 2. 全量拉取所有分支并更新
          # --no-single-branch 确保克隆时拉取远程所有分支（包括 anki），避免找不到分支引用
          git submodule update --init --recursive --remote --rebase --no-single-branch

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-sync submodules to latest upstream"
            git push
          else
            echo "No submodule updates detected. Working tree clean."
          fi