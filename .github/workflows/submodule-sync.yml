name: Submodule Auto-Sync

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 定时执行
  workflow_dispatch:     # 支持在 GitHub 网页手动点击触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false # 关闭默认浅克隆，由后续脚本手动接管
          fetch-depth: 0

      - name: Sync and update submodules
        shell: bash
        run: |
          # 1. 注册并同步子模块路径配置
          git submodule init
          git submodule sync --recursive

      # 2. 手动补全每个模块的 fetch 并获取远程分支
          for path in ftl/core-repo ftl/qt-repo qt/installer/mac-template qt/installer/windows-template; do
            git submodule update --init --no-checkout "$path"
            (cd "$path" && git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*" && git fetch origin)
          done

          # 3. 安全更新并对齐到远程目标分支
          git submodule update --recursive --remote --rebase

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-sync submodules to latest upstream"
            git push
          else
            echo "No submodule updates detected. Working tree clean."
          fi
